name: checks
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.0
      - run: uv sync --locked --extra dev --extra ui
      - run: uv pip check
      - run: uv run --no-sync lmaana-env --profile dev --profile ui
      - run: uv run --no-sync python -m ruff check src tests apps
      - run: uv run --no-sync python -m ruff format --check src tests apps
      - run: uv run --no-sync python -m pytest -q
